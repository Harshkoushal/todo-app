<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Register — Todo App</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="subtitle">Start organizing your tasks</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="registerForm">
      <div class="field">
        <label>Name</label>
        <input type="text" id="name" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" minlength="6" required />
      </div>
      <button type="submit" class="primary-btn">Register</button>
    </form>

    <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="api.js"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById("errorMsg");
    errorMsg.classList.remove("show");

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await apiRequest("/auth/register", "POST", { name, email, password });
      // auto-login right after registering
      const data = await apiRequest("/auth/login", "POST", { email, password });
      setToken(data.token);
      localStorage.setItem("userEmail", email);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.classList.add("show");
    }
  });
</script>

</body>
</html>
